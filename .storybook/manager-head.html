  The manager is a separate document from the preview iframe, so it does not
  get the fonts `preview-head.html` loads. `cinemaTheme` names Geist and
  Geist Mono; this is what makes them available here.
-->
<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>
<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>
<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
  rel="stylesheet"
/>
